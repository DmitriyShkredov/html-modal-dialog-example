<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-content">
        <strong>Личный кабинет</strong>
        <span>Профиль</span>
      </div>
    </header>

    <main class="container">
      <div class="page-heading">
        <div>
          <p class="eyebrow">НАСТРОЙКИ АККАУНТА</p>
          <h1>Мой профиль</h1>
        </div>
        <button class="btn btn-primary" id="openModal" type="button">
          Открыть профиль
        </button>
      </div>

      <dl class="profile">
        <div>
          <dt>Имя</dt>
          <dd>Александр Иванов</dd>
        </div>
        <div>
          <dt>Электронная почта</dt>
          <dd>alex@example.com</dd>
        </div>
        <div>
          <dt>Статус</dt>
          <dd><span class="badge">Активен</span></dd>
        </div>
      </dl>

      <dialog id="profileDialog" aria-labelledby="dialogTitle">
        <form method="dialog">
          <div class="modal-header">
            <h2 id="dialogTitle">Профиль</h2>
            <button
              class="close"
              type="submit"
              formnovalidate
              aria-label="Закрыть"
              title="Закрыть"
            >
              ×
            </button>
          </div>

          <div class="modal-body">
            <label for="name">Имя</label>
            <input
              id="name"
              name="name"
              value="Александр"
              autocomplete="given-name"
              autofocus
            />

            <label for="lastName">Фамилия</label>
            <input
              id="lastName"
              name="lastName"
              value="Иванов"
              autocomplete="family-name"
            />

            <label for="email">Электронная почта</label>
            <input
              id="email"
              name="email"
              type="email"
              value="alex@example.com"
              autocomplete="email"
            />
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary" type="submit" formnovalidate>
              Закрыть
            </button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>
